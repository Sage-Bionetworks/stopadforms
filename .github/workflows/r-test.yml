name: testthat

on:
  push:
    branches:
      - master
      - prod
  pull_request:
    branches:
      - master
      - prod
  workflow_dispatch:

jobs:
  test:
    # Pinned rather than ubuntu-latest, so a new Ubuntu release can't break
    # package installation before prebuilt binaries are available for it
    runs-on: ubuntu-24.04

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      # Needed to restore packages installed from GitHub, e.g. synapseforms
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        # libgit2-dev is needed by the gert package's prebuilt binary
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev libharfbuzz-dev libfribidi-dev

      # Use the R version recorded in renv.lock, which is also the version the
      # app runs on in shinyapps.io
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'renv'
          use-public-rspm: true

      # Install the package versions recorded in renv.lock
      - name: Install R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Run tests
        run: |
          remotes::install_local(".", dependencies = FALSE, upgrade = "never")
          testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}
